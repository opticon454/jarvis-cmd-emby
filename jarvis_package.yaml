name: "emby_play"
display_name: "Emby Play"
description: "Say \"play Hysteria by Muse on Emby\" and the node plays it from your own Emby server through its speaker."
version: "0.1.0"
min_jarvis_version: "0.9.0"
license: Apache-2.0
author:
  github: "opticon454"
categories: ["media"]
keywords: ["emby", "play", "music", "song", "album", "artist", "playlist"]

components:
  - type: command
    name: emby_play
    path: commands/emby_play/command.py

packages:
  - name: requests
    version: ">=2.31.0"

secrets:
  - key: EMBY_URL
    scope: integration
    value_type: string
    required: true
    is_sensitive: false
    description: "Address of your Emby server, e.g. http://192.168.1.10:8096"
    friendly_name: "Server URL"
  - key: EMBY_API_KEY
    scope: integration
    value_type: string
    required: true
    is_sensitive: true
    description: "An Emby API key (Dashboard, Advanced, API Keys)"
    friendly_name: "API key"
  - key: EMBY_USER_ID
    scope: integration
    value_type: string
    required: false
    is_sensitive: false
    description: "User to read playlists as (default: the first user)"
    friendly_name: "User ID"
